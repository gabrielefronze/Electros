[package]
name = "electros-tauri"
version = "3.1.6"
description = "Electros Desktop Application (Tauri)"
authors = ["Elemento Cloud Srl"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "electros_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0.6", features = [ "tray-icon"] }
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
image = { version = "0.24", default-features = false, features = ["webp", "jpeg", "png", "gif", "bmp"] }
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
keyring = "2"
sha2 = "0.10"
hex = "0.4"
url = "2"
percent-encoding = "2"
open = "5"
dark-light = "1"
parking_lot = "0.12"
once_cell = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
